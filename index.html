<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#ecebe8; --ink:#0d0d0e; --ink2:#1a1a1c; --mute:#8b8b8f; --line:rgba(255,255,255,.12);
  --card:#151517; --radius:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.grain::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- NAV ---------- */
.nav{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;
  padding:6px;border-radius:16px;background:rgba(20,20,22,.55);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 40px rgba(0,0,0,.25);transition:background .4s}
.nav.light{background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.08)}
.nav .logo{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;margin-right:6px}
.nav .logo img{width:26px;display:block}
.nav a.l{font-size:13px;font-weight:500;color:#fff;padding:10px 14px;border-radius:10px;transition:background .25s,color .4s}
.nav.light a.l{color:var(--ink)}
.nav a.l:hover{background:rgba(255,255,255,.12)} .nav.light a.l:hover{background:rgba(0,0,0,.06)}
.btn{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;padding:6px 6px 6px 16px;border-radius:12px;background:#fff;color:var(--ink);border:1px solid rgba(0,0,0,.08);cursor:pointer;transition:transform .25s}
.btn:hover{transform:translateY(-1px)}
.btn i{width:28px;height:28px;border-radius:9px;background:var(--ink);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px;transition:transform .3s}
.btn:hover i{transform:rotate(-45deg)}
.btn.dark{background:var(--ink);color:#fff}.btn.dark i{background:#fff;color:var(--ink)}
.burger{display:none}

/* ---------- HERO ---------- */
.hero-wrap{padding:14px;height:100vh;min-height:640px}
.hero{position:relative;height:100%;border-radius:var(--radius);overflow:hidden;background:#09090a;color:#fff;isolation:isolate}
.hero .scene{position:absolute;inset:0;z-index:-1}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9}
.b1{width:60vw;height:60vw;right:-12vw;top:-18vw;background:radial-gradient(circle,#4a4a50 0%,#1c1c1f 50%,transparent 70%);animation:float 16s ease-in-out infinite}
.b2{width:38vw;height:38vw;right:14vw;bottom:-14vw;background:radial-gradient(circle,#6b5a4a 0%,#2a2420 45%,transparent 70%);animation:float 20s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(-4vw,3vw) scale(1.08)}}
/* film strip shape */
.reel{position:absolute;right:6vw;top:50%;width:min(36vw,520px);aspect-ratio:1;transform:translateY(-52%);}
.reel .disc{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#1b1b1e,#3a3a3f,#141416,#2c2c30,#101012,#38383d,#1b1b1e);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 40px 120px rgba(0,0,0,.6);animation:spin 40s linear infinite}
.reel .disc::before{content:"";position:absolute;inset:9%;border-radius:50%;background:
  radial-gradient(circle at 50% 22%,#0b0b0c 0 9%,transparent 9.5%),radial-gradient(circle at 78% 62%,#0b0b0c 0 9%,transparent 9.5%),radial-gradient(circle at 22% 62%,#0b0b0c 0 9%,transparent 9.5%),
  radial-gradient(circle,#0b0b0c 0 7%,#2a2a2e 7.5% 14%,transparent 14.5%),
  repeating-radial-gradient(circle,#1d1d20 0 2px,#222226 2px 4px)}
@keyframes spin{to{transform:rotate(360deg)}}
.reel .glass{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;cursor:pointer;transition:transform .3s}
.reel .glass:hover{transform:scale(1.08)}
.reel .glass svg{width:26px;margin-left:5px}
.hero h1{position:absolute;left:clamp(24px,7vw,110px);top:clamp(130px,24vh,240px);max-width:620px;font-weight:500;font-size:clamp(30px,3.6vw,54px);line-height:1.1;letter-spacing:-.025em}
.hero h1 .w{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(14px);animation:rv .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero h1 .dim{color:rgba(255,255,255,.45)}
@keyframes rv{to{opacity:1;filter:blur(0);transform:none}}
.vibe{position:absolute;right:clamp(20px,5vw,80px);bottom:30%;display:flex;gap:12px;align-items:center;padding:8px 16px 8px 8px;border-radius:16px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);font-size:12px;line-height:1.35;color:rgba(255,255,255,.8);max-width:250px;opacity:0;animation:rv 1s 1.6s forwards}
.vibe .th{width:62px;height:78px;border-radius:10px;flex:none;background:linear-gradient(160deg,#5c4c3d,#1a1714);position:relative;overflow:hidden}
.vibe .th::after{content:"";position:absolute;left:50%;top:50%;border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;transform:translate(-35%,-50%);opacity:.9}
.watermark{position:absolute;left:0;right:0;bottom:-0.13em;text-align:center;font-family:Anton,sans-serif;font-size:clamp(90px,19vw,330px);line-height:1;letter-spacing:-.01em;white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.06) 75%);-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none;user-select:none}
.notch{position:absolute;left:0;bottom:0;background:var(--bg);padding:16px 26px 14px 22px;border-top-right-radius:24px;display:flex;gap:18px;color:var(--ink);z-index:3}
.notch::before,.notch::after{content:"";position:absolute;width:24px;height:24px;background:transparent}
.notch::before{left:0;top:-24px;border-bottom-left-radius:24px;box-shadow:-8px 8px 0 8px var(--bg)}
.notch::after{right:-24px;bottom:0;border-bottom-left-radius:24px;box-shadow:-8px 8px 0 8px var(--bg)}
.notch a{font-size:13px;font-weight:600;opacity:.75;transition:opacity .2s}.notch a:hover{opacity:1}
.scroll-hint{position:absolute;right:28px;bottom:26px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5);display:flex;gap:10px;align-items:center}
.scroll-hint span{width:1px;height:38px;background:linear-gradient(#fff,transparent);animation:drop 2s infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- SECTIONS ---------- */
section{padding:clamp(80px,12vw,150px) clamp(20px,6vw,90px)}
.eyebrow{font-size:12px;color:var(--mute);letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* services */
.services{display:grid;grid-template-columns:1fr 1.25fr;gap:60px;align-items:end}
.services .left .num{font-size:12px;color:var(--mute);margin:34px 0 14px}
.services .left p.small{font-size:13px;color:var(--mute);max-width:300px;line-height:1.6}
.services h2{font-size:clamp(34px,4.2vw,60px);font-weight:500;letter-spacing:-.03em;line-height:1.05;margin:90px 0 26px}
.carousel-wrap{position:relative;min-width:0}.services>*{min-width:0}
.carousel{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.carousel::-webkit-scrollbar{display:none}
.scard{flex:0 0 min(300px,72vw);height:430px;border-radius:22px;position:relative;overflow:hidden;color:#fff;scroll-snap-align:start;padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.scard:hover{transform:translateY(-6px)}
.scard .art{position:absolute;inset:0;z-index:0;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.scard:hover .art{transform:scale(1.07)}
.scard>*:not(.art){position:relative;z-index:1}
.scard h3{font-size:24px;font-weight:500;letter-spacing:-.02em}
.scard .ref{font-size:11px;opacity:.6;margin-top:4px;letter-spacing:.08em}
.scard p{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.65);margin:8px 0 16px;max-width:240px}
.scard .big{font-size:30px;font-weight:500;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600;padding:5px 5px 5px 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.pill i{width:24px;height:24px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-style:normal;font-size:12px}
.arrows{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.arrows button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,0,0,.12);background:transparent;cursor:pointer;font-size:15px;transition:all .25s}
.arrows button:last-child{background:var(--ink);color:#fff}
.arrows button:hover{transform:scale(1.08)}
/* arts */
.a1{background:radial-gradient(120% 80% at 70% 10%,#6a5644 0%,#2b231c 40%,#111 75%)}
.a1::after{content:"";position:absolute;left:18%;right:18%;top:22%;bottom:30%;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(180deg,rgba(255,255,255,.08),transparent)}
.a2{background:conic-gradient(from 200deg at 60% 40%,#0f0f10,#3b3b42,#121214,#56565e,#0f0f10)}
.a2::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 60% 40%,transparent 0 18%,rgba(0,0,0,.6) 60%)}
.a3{background:repeating-linear-gradient(90deg,#111 0 22px,#1b1b1d 22px 26px),linear-gradient(#111,#000);}
.a3::after{content:"";position:absolute;left:0;right:0;top:34%;height:30%;background:linear-gradient(90deg,#3d3229,#8a7461,#2c2620);mix-blend-mode:screen;opacity:.55;filter:blur(2px)}
.a4{background:radial-gradient(80% 60% at 30% 80%,#4c4c52 0%,#161618 55%,#0a0a0b 100%)}
.a4::after{content:"REC ●";position:absolute;right:20px;top:22px;font-size:11px;letter-spacing:.16em;color:#ff4a3d;font-weight:600}

/* manifesto scroll text */
.manifesto{text-align:center;padding-top:40px}
.manifesto p{max-width:1000px;margin:0 auto;font-size:clamp(26px,3.3vw,48px);font-weight:500;letter-spacing:-.025em;line-height:1.18}
.manifesto p span{color:#c3c2bf;transition:color .3s}
.manifesto p span.on{color:var(--ink)}

/* showreel */
.showreel{display:grid;grid-template-columns:2.2fr 1fr;gap:18px;padding-top:0}
.vid{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:16/8.5;background:#0b0b0c;color:#fff;cursor:pointer}
.vid .art{position:absolute;inset:0;background:
  radial-gradient(50% 70% at 50% 120%,#5a4838 0%,transparent 60%),
  radial-gradient(40% 50% at 80% 20%,#2f2f35 0%,transparent 70%),#09090a;transition:transform 1.4s}
.vid:hover .art{transform:scale(1.04)}
.vid .bars{position:absolute;left:0;right:0;height:9%;background:#000;z-index:1}.vid .bars.t{top:0}.vid .bars.b{bottom:0}
.vid .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;z-index:2;transition:transform .35s}
.vid:hover .play{transform:translate(-50%,-50%) scale(1.1)}
.vid .play svg{width:28px;margin-left:5px}
.vid .lbl{position:absolute;left:28px;bottom:28px;z-index:2}
.vid .lbl b{display:block;font-size:clamp(22px,2.4vw,34px);font-weight:500;letter-spacing:-.02em}
.vid .lbl small{font-size:12px;opacity:.6;letter-spacing:.1em;text-transform:uppercase}
.vid .tc{position:absolute;right:28px;bottom:30px;z-index:2;font-family:ui-monospace,monospace;font-size:12px;opacity:.6}
.profile{border-radius:26px;background:#dcdbd7;padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.profile .tag{font-size:11px;color:var(--mute);letter-spacing:.06em}
.profile .name{font-size:28px;font-weight:500;letter-spacing:-.02em;margin-top:6px}
.profile .role{font-size:13px;color:#555;margin-top:4px}
.profile blockquote{font-size:15px;line-height:1.5;color:#333;margin:28px 0}
.profile .row{display:flex;align-items:center;justify-content:space-between}
.avatar{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.avatar img{width:32px;display:block}

/* projects */
.proj-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:44px;flex-wrap:wrap}
.proj-head h2{font-size:clamp(34px,4.2vw,60px);font-weight:500;letter-spacing:-.03em;line-height:1.05;margin-top:16px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:500 13px "Inter Tight",system-ui,sans-serif;padding:9px 16px;border-radius:99px;border:1px solid rgba(0,0,0,.12);background:transparent;cursor:pointer;transition:all .25s}
.filters button.act{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pc{position:relative;aspect-ratio:9/16;border-radius:22px;overflow:hidden;color:#fff;background:#111;cursor:pointer;transition:opacity .4s,transform .5s}
.pc.hide{display:none}
.pc .art{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.pc:hover .art{transform:scale(1.06)}
.pc .ui{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 55%,rgba(0,0,0,.75))}
.pc .top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;opacity:.85}
.pc h4{font-size:19px;font-weight:500;letter-spacing:-.01em}
.pc .meta{font-size:12px;opacity:.6;margin-top:4px}
.pc .mini{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:all .35s}
.pc:hover .mini{opacity:1;transform:scale(1)}
.pc .mini svg{width:18px;margin-left:3px}
.p1{background:linear-gradient(170deg,#2b2b2f,#0c0c0d 60%),#111}
.p1::after{content:"";position:absolute;left:-20%;right:-20%;top:45%;height:24%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:rotate(-14deg);filter:blur(6px)}
.p2{background:radial-gradient(70% 50% at 50% 35%,#7a6250 0%,#2a211a 55%,#0d0b09 100%)}
.p3{background:repeating-conic-gradient(from 0deg at 50% 60%,#0d0d0e 0 8deg,#18181a 8deg 16deg)}
.p3::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.22),transparent 40%)}
.p4{background:linear-gradient(200deg,#46464c 0%,#151517 45%,#050505 100%)}
.p4::after{content:"";position:absolute;left:22%;right:22%;top:28%;bottom:36%;border-radius:50% 50% 12px 12px;background:linear-gradient(#0a0a0a,#000);box-shadow:0 0 80px rgba(255,255,255,.12)}
.p5{background:radial-gradient(60% 40% at 30% 70%,#5e4e40,transparent 70%),radial-gradient(50% 40% at 80% 20%,#3d3d44,transparent 70%),#0a0a0b}
.p6{background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,#111}
.p6::before{content:"";position:absolute;inset:16% 12%;border:1px solid rgba(255,255,255,.18);border-radius:16px}
.p6::after{content:"";position:absolute;left:12%;right:12%;top:44%;height:1px;background:rgba(255,255,255,.4);box-shadow:0 30px 0 rgba(255,255,255,.15),0 -30px 0 rgba(255,255,255,.15)}
.p7{background:conic-gradient(from 90deg at 50% 50%,#1a1612,#6b5543,#1a1612,#3a3a40,#1a1612)}
.p7::after{content:"";position:absolute;inset:0;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.p8{background:radial-gradient(circle at 50% 30%,#55555c,#141416 50%,#060606)}

/* process */
.process{background:var(--ink);color:#fff;border-radius:var(--radius);margin:0 14px;position:relative;overflow:hidden}
.process .eyebrow{color:rgba(255,255,255,.5)}.process .eyebrow::before{background:#fff}
.process h2{font-size:clamp(34px,4.2vw,60px);font-weight:500;letter-spacing:-.03em;line-height:1.05;margin:16px 0 60px;max-width:760px}
.process h2 em{font-style:normal;color:rgba(255,255,255,.4)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:20px;overflow:hidden}
.step{background:var(--ink);padding:30px 26px 34px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;transition:background .4s}
.step:hover{background:#18181a}
.step .n{font-family:Anton;font-size:46px;color:rgba(255,255,255,.18);transition:color .4s}
.step:hover .n{color:#fff}
.step h5{font-size:20px;font-weight:500;margin-bottom:8px}
.step p{font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.55)}

/* contact */
.contact{text-align:center}
.contact h2{font-size:clamp(44px,7.5vw,120px);font-weight:500;letter-spacing:-.045em;line-height:.95;margin:22px 0 34px}
.contact h2 span{color:#b9b8b4}
.contact .eyebrow{justify-content:center}
.mail{display:inline-flex;align-items:center;gap:14px;font-size:clamp(18px,2vw,26px);font-weight:500;padding:12px 12px 12px 28px;border-radius:99px;background:var(--ink);color:#fff;transition:transform .3s}
.mail:hover{transform:scale(1.03)}
.mail i{width:46px;height:46px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-style:normal;transition:transform .35s}
.mail:hover i{transform:rotate(-45deg)}
.copied{display:block;font-size:12px;color:var(--mute);margin-top:14px;min-height:16px}
.socials{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.socials a{font-size:13px;font-weight:500;padding:9px 16px;border-radius:99px;border:1px solid rgba(0,0,0,.12);transition:all .25s}
.socials a:hover{background:var(--ink);color:#fff}

footer{margin:0 14px 14px;border-radius:var(--radius);background:#0a0a0b;color:#fff;position:relative;overflow:hidden;padding:40px clamp(20px,5vw,60px) 0}
footer .fr{display:flex;justify-content:space-between;gap:20px;font-size:13px;color:rgba(255,255,255,.55);flex-wrap:wrap;position:relative;z-index:2}
footer .fr a:hover{color:#fff}
footer .wm{font-family:Anton;font-size:clamp(90px,21vw,360px);line-height:.82;text-align:center;margin-top:40px;letter-spacing:-.01em;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.02));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.modal .box{width:min(900px,100%);aspect-ratio:16/9;border-radius:22px;background:#0b0b0c;color:#fff;display:grid;place-items:center;text-align:center;position:relative;border:1px solid rgba(255,255,255,.1)}
.modal .box p{color:rgba(255,255,255,.6);font-size:14px;margin-top:10px}
.modal .x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-size:18px;cursor:pointer}

/* ---------- RESPONSIVE ---------- */
@media (max-width:980px){
  .services,.showreel{grid-template-columns:1fr}
  .services h2{margin-top:40px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr 1fr}
  .reel{right:-14vw;width:70vw;opacity:.55}
}
@media (max-width:720px){
  .nav a.l{display:none}
  .nav{width:calc(100% - 40px);justify-content:space-between}
  .burger{display:grid;width:38px;height:38px;border-radius:11px;border:0;background:rgba(255,255,255,.12);color:#fff;place-items:center;cursor:pointer;font-size:16px}
  .nav.light .burger{background:rgba(0,0,0,.06);color:var(--ink)}
  .nav.open{flex-wrap:wrap}
  .nav.open a.l{display:block;width:100%}
  .hero h1{top:120px;right:24px}
  .vibe{bottom:24%;left:24px;right:auto}
  .reel{top:auto;bottom:6%;transform:none;right:-20vw;width:80vw}
  .scroll-hint{display:none}
  .steps{grid-template-columns:1fr}
  .vid{aspect-ratio:4/5}
  .watermark{font-size:23vw;bottom:-.1em}
  footer .wm{font-size:23vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero h1 .w,.vibe,.reveal{opacity:1;filter:none;transform:none}}

/* ---------- media ---------- */
.media-fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero .bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:.5}
.hero.has-video .reel{display:none}
.pc video.media-fill,.pc img.media-fill{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.pc:hover .media-fill{transform:scale(1.06)}
.scard .media-fill{opacity:.75}
.vid .media-fill{z-index:0}
.vid::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.6));pointer-events:none}
.modal .box{overflow:hidden}
.modal .box video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.modal .box.vertical{aspect-ratio:9/16;width:auto;height:min(86vh,100%)}

/* ---------- private bar ---------- */
.adminbar{margin:0 14px 14px;border-radius:22px;border:1.5px dashed rgba(0,0,0,.22);padding:20px 24px;display:none;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:rgba(255,255,255,.4)}
.adminbar.show{display:flex}
.adminbar b{font-size:15px;font-weight:600}
.adminbar small{display:block;font-size:12.5px;color:var(--mute);margin-top:3px}

/* ---------- editor drawer ---------- */
.ed{position:fixed;inset:0;z-index:200;display:none}
.ed.open{display:block}
.ed .shade{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.ed .panel{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:#f6f5f2;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.ed header{padding:18px 20px;border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;gap:12px}
.ed header img{width:30px}
.ed header h3{font-size:17px;font-weight:600;flex:1}
.ed header button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.12);background:#fff;cursor:pointer;font-size:15px}
.ed .tabs{display:flex;gap:6px;padding:12px 20px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(0,0,0,.06)}
.ed .tabs button{font:500 12.5px "Inter Tight",system-ui,sans-serif;padding:8px 13px;border-radius:99px;border:1px solid rgba(0,0,0,.12);background:transparent;cursor:pointer;white-space:nowrap}
.ed .tabs button.act{background:var(--ink);color:#fff;border-color:var(--ink)}
.ed .body{flex:1;overflow-y:auto;padding:18px 20px 30px}
.ed .grp{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid rgba(0,0,0,.06)}
.ed .grp h4{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.ed .grp h4 span{font-weight:500;color:var(--mute);font-size:11.5px}
.ed label{display:block;font-size:11.5px;font-weight:600;color:#555;margin:10px 0 5px;letter-spacing:.02em}
.ed label:first-of-type{margin-top:0}
.ed input[type=text],.ed textarea,.ed select{width:100%;font:400 14px "Inter Tight",system-ui,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid rgba(0,0,0,.14);background:#fbfbfa;color:var(--ink)}
.ed textarea{min-height:76px;resize:vertical;line-height:1.45}
.ed input:focus,.ed textarea:focus,.ed select:focus{outline:2px solid var(--ink);outline-offset:-1px;background:#fff}
.mf{display:flex;gap:12px;align-items:center}
.mf .pv{width:64px;height:64px;border-radius:10px;background:#1a1a1c;flex:none;overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.4);font-size:10px;text-align:center}
.mf .pv img,.mf .pv video{width:100%;height:100%;object-fit:cover}
.mf .act{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.mf .act .nm{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mf .act div{display:flex;gap:6px}
.sbtn{font:600 12px "Inter Tight",system-ui,sans-serif;padding:8px 12px;border-radius:9px;border:1px solid rgba(0,0,0,.14);background:#fff;cursor:pointer}
.sbtn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.sbtn.red{color:#c0392b}
.sbtn:disabled{opacity:.5;cursor:default}
.ed footer{padding:14px 20px;border-top:1px solid rgba(0,0,0,.08);display:flex;gap:10px;align-items:center;background:#f6f5f2}
.ed footer .st{flex:1;font-size:12.5px;color:var(--mute)}
.ed footer .st.ok{color:#1e8a4c}.ed footer .st.err{color:#c0392b}
.ed .hint{font-size:12px;color:var(--mute);line-height:1.5;margin:-2px 0 14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;transition:all .35s;z-index:300;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

.scard>.media-fill{position:absolute;z-index:0}

.hero.has-video .scene{display:none}
.hero.has-video .bgvid{opacity:.6}
.hero.portrait .bgvid{inset:auto;right:clamp(20px,6vw,100px);top:50%;transform:translateY(-50%);height:min(72%,640px);width:auto;aspect-ratio:9/16;border-radius:26px;opacity:1;z-index:0;box-shadow:0 40px 100px rgba(0,0,0,.55);outline:1px solid rgba(255,255,255,.12)}
.hero.portrait .vibe{z-index:2;right:calc(clamp(20px,6vw,100px) + 40px);bottom:16%}
@media (max-width:720px){.hero.portrait .bgvid{inset:0;transform:none;width:100%;height:100%;border-radius:0;opacity:.55;aspect-ratio:auto;outline:0;box-shadow:none}.hero.portrait .vibe{right:auto;left:24px;bottom:24%}}

.hero .bgfull{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.6}
.hero.has-bg .scene{display:none}
.hero.has-bg::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.35) 100%),linear-gradient(180deg,transparent 60%,rgba(0,0,0,.55))}
</style>

  return typeof over===typeof base?over:base;
}

/* ================= RENDU ================= */
function render(){
  // hero
  const words=C.heroTitle.trim().split(/\s+/),cut=Math.ceil(words.length*.55);
  const h=$('heroTitle');h.innerHTML='';
  words.forEach((w,i)=>{const s=el('span','w'+(i>=cut?' dim':''),w);s.style.animationDelay=(.15+i*.06)+'s';h.append(s,' ')});
  const hero=$('hero');hero.querySelector('.bgvid')?.remove();
  const hv=mediaEl(C.heroVideo,{cls:'bgvid'});hero.classList.toggle('has-video',!!hv);if(hv)hero.prepend(hv);hero.querySelector('.bgfull')?.remove();const hb=mediaEl(C.heroBg,{cls:'bgfull'});hero.classList.toggle('has-bg',!!hb);if(hb)hero.prepend(hb);hero.classList.remove('portrait');if(hv){const f=()=>{const w=hv.videoWidth||hv.naturalWidth,h=hv.videoHeight||hv.naturalHeight;hero.classList.toggle('portrait',h>w*1.05)};hv.addEventListener(hv.tagName==='VIDEO'?'loadedmetadata':'load',f);f()}
  $('vibeText').innerHTML='';C.vibeText.split('\n').forEach((l,i)=>{if(i)$('vibeText').append(el('br'));$('vibeText').append(l)});
  const vt=$('vibeThumb');vt.querySelector('.media-fill')?.remove();const vm=mediaEl(C.vibeImage);if(vm)vt.prepend(vm);
  // réseaux (notch + contact)
  const soc=[['IG','Instagram',C.instagram],['TK','TikTok',C.tiktok],['YT','YouTube',C.youtube]].filter(x=>safeUrl(x[2]));
  $('notch').innerHTML='';$('socials').innerHTML='';

    const b=el('a',null,l==='Instagram'&&/instagram\.com\/([^/?#]+)/.test(u)?'Instagram · @'+u.match(/instagram\.com\/([^/?#]+)/)[1]:l);b.href=safeUrl(u);b.target='_blank';b.rel='noopener';$('socials').append(b)});
  $('notch').style.display=soc.length?'':'none';
  // services
  $('servicesText').textContent=C.servicesText;$('servicesTitle').textContent=C.servicesTitle;
  const car=$('carousel');car.innerHTML='';
  C.services.forEach((s,i)=>{const a=el('article','scard');a.append(el('div','art '+SARTS[i%4]));const m=mediaEl(s.image);if(m)a.append(m);
    const t=el('div');t.append(el('h3',null,s.title),el('div','ref','RMK-0'+(i+1)));
    const b=el('div');if(s.big)b.append(el('div','big',s.big));b.append(el('p',null,s.desc));const pl=el('span','pill','En savoir plus ');pl.append(el('i',null,'↗'));b.append(pl);
    a.append(t,b);car.append(a)});

  const vmw=$('vidMedia');vmw.innerHTML='';const rp=mediaEl(C.reelPoster)||mediaEl(C.reelVideo);if(rp)vmw.append(rp);
  $('pName').textContent=C.pName;$('pRole').textContent=C.pRole;$('pQuote').textContent=C.pQuote;
  // projets
  $('projTitle').textContent=C.projTitle;
  const g=$('grid');g.innerHTML='';
  C.projects.forEach((p,i)=>{
    const c=el('div','pc reveal in');c.dataset.c=p.cat;c.dataset.open='p'+i;
    c.append(el('div','art '+ARTS[i%8]));
    const th=mediaEl(p.thumb)||mediaEl(p.video,{autoplay:false});if(th)c.append(th);
    if(!p.thumb&&p.video&&th){c.addEventListener('mouseenter',()=>th.play().catch(()=>{}));c.addEventListener('mouseleave',()=>{th.pause()})}
    const ui=el('div','ui'),top=el('div','top');top.append(el('span',null,p.cat==='motion'?'MOTION':'REEL'),el('span',null,p.dur));
    const bt=el('div');bt.append(el('h4',null,p.title),el('div','meta',p.meta));ui.append(top,bt);
    const mini=el('div','mini');mini.innerHTML=PLAY;c.append(ui,mini);g.append(c)});
  applyFilter();
  // process
  $('procA').textContent=C.procA;$('procB').textContent=C.procB;
  const st=$('steps');st.innerHTML='';C.steps.forEach((s,i)=>{const d=el('div','step');d.append(el('div','n','0'+(i+1)));const b=el('div');b.append(el('h5',null,s.title),el('p',null,s.desc));d.append(b);st.append(d)});
  // contact
  $('cA').textContent=C.cA;$('cB').textContent=C.cB;$('mailTxt').textContent=C.email;$('mail').href='mailto:'+C.email.replace(/[^\w.@+-]/g,'');
}
